name: electoral-junior
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-electoral_db}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_ddl_electoral.sql:/docker-entrypoint-initdb.d/01_ddl_electoral.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  etl:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./output:/app/output
  prefect-server:
    profiles: [orchestration]
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    entrypoint: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - prefectdata:/root/.prefect
  scheduler:
    profiles: [orchestration]
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    entrypoint: ["python", "-m", "orchestration.flows", "serve"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_API_DATABASE_MIGRATE_ON_START: "false"
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_started
    restart: on-failure
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output
volumes:
  pgdata:
  prefectdata:
